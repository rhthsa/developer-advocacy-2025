apiVersion: apps.gitlab.com/v1beta1
kind: GitLab
metadata:
  name: gitlab
  namespace: gitlab-system
spec:
  chart:
    values:
      certmanager:
        install: false
      global:
        hosts:
          domain: example.com
        ingress:
          configureCertmanager: false
      postgresql:
        primary:
          extendedConfiguration: max_connections = 200
    version: 9.0.1
